[package]
name = "atelier-setup"
version = "0.0.0"
edition = "2021"
publish = false
description = "Atelier's own Windows installer and uninstaller (docs/contracts/desktop-shell.md)"

[target.'cfg(windows)'.dependencies]
flate2 = "1"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37"
winreg = "0.56"
wry = "0.57"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
