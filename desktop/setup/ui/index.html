<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title></title>
<style>
  /* Colours and type from DESIGN.md / web/src/styles/tokens.css (graphite + lime accent). */
  @font-face { font-family: Inter; src: url(fonts/inter-latin-wght-normal.woff2) format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'Instrument Serif'; src: url(fonts/instrument-serif-latin-400-normal.woff2) format('woff2'); }
  :root { --bg: #0A0A0B; --fg: #EDEDEF; --muted: #8E8E93; --track: rgba(255,255,255,.08); --line: rgba(255,255,255,.08);
          --input: rgba(255,255,255,.14); --card: #18181B; --hover: #26262A; --primary: #D4F53C; --on-primary: #0A0A0B; --glow: rgba(212,245,60,.06); }
  :root.light { --bg: #F2F2F3; --fg: #0A0A0B; --muted: #6E6E73; --track: rgba(0,0,0,.08); --line: rgba(0,0,0,.08);
                --input: rgba(0,0,0,.10); --card: #FFFFFF; --hover: #E6E6E8; --primary: #5E7A00; --on-primary: #FFFFFF; --glow: rgba(94,122,0,.06); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--bg) radial-gradient(520px 320px at 100% 0%, var(--glow), transparent 70%); color: var(--fg);
         font: 14px/1.5 Inter, "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif; -webkit-font-smoothing: antialiased;
         -webkit-user-select: none; user-select: none; cursor: default; }
  .chrome { position: fixed; top: 0; right: 0; display: flex; z-index: 1; }
  .chrome button { width: 40px; height: 32px; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; }
  .chrome button:hover { background: var(--hover); color: var(--fg); }
  .chrome button:disabled { visibility: hidden; }
  main { height: 100%; display: flex; flex-direction: column; align-items: center; }
  .mark { width: 64px; height: 64px; background: var(--fg); -webkit-mask: url(mark.svg) center / contain no-repeat; mask: url(mark.svg) center / contain no-repeat; }
  .word { margin-top: 12px; font-family: 'Instrument Serif', serif; font-size: 36px; line-height: 44px; font-weight: 400; letter-spacing: .01em; }
  .slot { display: flex; flex-direction: column; align-items: center; }
  .btn { height: 40px; padding: 0 20px; border-radius: 10px; border: 1px solid var(--input); background: var(--card); color: var(--fg);
         font-family: inherit; font-size: 14px; font-weight: 500; line-height: 1; display: inline-flex; align-items: center; justify-content: center; }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--primary); border-color: transparent; color: var(--on-primary); }
  .btn.primary:hover { filter: brightness(.94); }
  .btn.wide { width: 200px; }
  .btn.short { height: 36px; }
  .btn:focus-visible, .link:focus-visible, .check:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .row { display: flex; gap: 8px; }
  .small { font-size: 12px; color: var(--muted); }
  .link { border: 0; padding: 0; background: none; font: inherit; color: var(--fg); text-decoration: underline;
          text-decoration-color: var(--input); text-underline-offset: 3px; }
  .path { font-family: Inter, sans-serif; max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .field { flex: 1; min-width: 0; height: 36px; border: 1px solid var(--input); border-radius: 10px; background: var(--card);
           padding: 0 12px; display: flex; align-items: center; font-size: 13px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .check { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; border: 0; background: none; color: inherit; padding: 0; font-family: inherit; }
  .check i { width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--input); display: grid; place-items: center; }
  .check[aria-checked="true"] i { background: var(--primary); border-color: transparent; }
  .check[aria-checked="false"] svg { display: none; }
  .bar { width: 280px; height: 4px; border-radius: 4px; background: var(--track); overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; border-radius: 4px; background: var(--primary); transition: width 160ms linear; }
  .bar.busy > i { width: 30%; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(330%); } }
  @media (prefers-reduced-motion: reduce) { .bar.busy > i { animation: none; } }
  .meta { width: 280px; margin-top: 12px; display: flex; justify-content: space-between; }
  .pct { font-variant-numeric: tabular-nums; }
  h1 { margin: 0; font-size: 16px; font-weight: 500; }
  .version { position: fixed; left: 24px; bottom: 20px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="chrome">
  <button id="min" type="button" aria-label="最小化"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor"><path d="M0 5.5h10"/></svg></button>
  <button id="close" type="button" aria-label="关闭"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor"><path d="M.5.5l9 9M9.5.5l-9 9"/></svg></button>
</div>
<main>
  <div id="top" style="height:96px"></div>
  <div class="mark" aria-hidden="true"></div>
  <div class="word" id="word"></div>
  <div id="gap" style="height:40px"></div>
  <div class="slot" id="slot"></div>
</main>
<div class="version small" id="version"></div>
<script>
  const S = window.__SETUP__;
  const $ = (id) => document.getElementById(id);
  const post = (cmd, extra = {}) => window.ipc.postMessage(JSON.stringify({ cmd, ...extra }));
  const tick = '<svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="var(--on-primary)" stroke-width="1.6"><path d="M1.5 5.2l2.3 2.3 4.7-5"/></svg>';
  const esc = (text) => String(text).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  if (S.theme === 'light') document.documentElement.classList.add('light');
  document.title = S.role === 'uninstall' ? `卸载 ${S.product}` : S.product;
  $('word').textContent = S.product;
  $('version').textContent = S.version;

  const plan = { dir: S.dir, desktop: true };
  let busy = false;
  let lastError = '';
  let after = '';  // the step to run (again): install / uninstall

  const button = (label, cmd, kind = '') => `<button type="button" class="btn ${kind}" data-cmd="${cmd}">${label}</button>`;
  const progressView = (label) => `<div class="bar"><i id="fill"></i></div>
    <div class="meta small"><span>${label}</span><span class="pct" id="pct">0%</span></div>`;
  const message = (title, detail, buttons) => `<h1>${title}</h1><div class="small" style="margin-top:6px">${detail}</div>
    <div class="row" style="margin-top:24px">${buttons}</div>`;

  const views = {
    welcome: () => S.existingVersion
      ? `${button('立即更新', 'install', 'primary wide')}<div class="small" style="margin-top:16px">已安装 ${esc(S.existingVersion)}，作品与设置保留</div>`
      : `${button('立即安装', 'install', 'primary wide')}
         <div class="small" style="margin-top:16px;display:flex;gap:12px;align-items:center">
           <span>安装到 <span class="path">${esc(plan.dir)}</span></span><button type="button" class="link" data-cmd="custom">更改</button></div>`,
    custom: () => `<div style="width:440px;display:flex;flex-direction:column;gap:12px">
        <div class="small">安装位置</div>
        <div class="row"><div class="field" title="${esc(plan.dir)}">${esc(plan.dir)}</div>${button('浏览', 'browse', 'short')}</div>
        <button type="button" class="check" role="checkbox" aria-checked="${plan.desktop}" data-cmd="toggle-desktop"><i>${tick}</i>创建桌面快捷方式</button>
      </div><div style="height:24px"></div>${button('立即安装', 'install', 'primary wide')}`,
    installing: () => progressView(S.existingVersion ? '正在更新' : '正在安装'),
    done: () => `${button('开始使用', 'launch', 'primary wide')}<div class="small" style="margin-top:16px">${S.existingVersion ? '更新完成' : '安装完成'}</div>`,
    running: () => message(`${esc(S.product)} 正在运行`, '继续会先退出它，进行中的任务会先确认',
      button('取消', S.role === 'uninstall' ? 'exit' : 'back') + button('退出并继续', 'quit-app', 'primary')),
    quitting: () => `<div class="bar busy"><i></i></div><div class="meta small"><span>正在等待 ${esc(S.product)} 退出</span><span></span></div>`,
    error: () => message(S.role === 'uninstall' ? '卸载没有完成' : '安装没有完成', esc(lastError),
      button('关闭', 'exit') + button('重试', 'retry', 'primary')),
    confirm: () => message(`卸载 ${esc(S.product)}`, '作品与数据目录会保留', button('取消', 'exit') + button('卸载', 'uninstall')),
    uninstalling: () => progressView('正在卸载'),
    uninstalled: () => message('已卸载', '作品与数据目录已保留', button('完成', 'exit', 'primary')),
  };
  // Message states sit higher so title, detail and buttons stay centred as a group.
  const layout = { custom: [64, 28], running: [80, 32], error: [80, 32], confirm: [80, 32], uninstalled: [80, 32] };

  function show(next) {
    busy = ['installing', 'quitting', 'uninstalling'].includes(next);
    $('close').disabled = busy;
    const [top, gap] = layout[next] || [96, busy ? 48 : 40];
    $('top').style.height = `${top}px`;
    $('gap').style.height = `${gap}px`;
    $('slot').innerHTML = views[next]();
  }

  function start(kind) {
    after = kind;
    post(kind, kind === 'install' ? { plan } : {});
  }

  $('slot').addEventListener('click', (event) => {
    const target = event.target.closest('[data-cmd]');
    if (!target || S.preview) return;
    const cmd = target.dataset.cmd;
    if (cmd === 'custom') return show('custom');
    if (cmd === 'back') return show('welcome');
    if (cmd === 'toggle-desktop') { plan.desktop = !plan.desktop; return show('custom'); }
    if (cmd === 'install' || cmd === 'uninstall') return start(cmd);
    if (cmd === 'retry') return start(after || (S.role === 'uninstall' ? 'uninstall' : 'install'));
    if (cmd === 'quit-app') { show('quitting'); return post('quit-app', { then: after, plan }); }
    post(cmd, cmd === 'launch' ? { plan } : {});
  });
  $('min').onclick = () => post('minimize');
  $('close').onclick = () => { if (!busy) post('exit'); };
  // The whole window is a drag handle except its controls.
  document.addEventListener('mousedown', (event) => {
    if (event.button === 0 && !event.target.closest('button, .field')) post('drag');
  });
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && !busy && !S.preview) post('exit');
    // Enter is the main button, without drawing a focus ring on it at every screen.
    if (event.key === 'Enter' && !event.target.closest('button')) {
      const primary = $('slot').querySelector('.btn.primary');
      if (primary) primary.click();
    }
  });
  document.addEventListener('contextmenu', (event) => event.preventDefault());

  // Called by the installer (desktop/setup/src/ui.rs).
  window.setup = {
    show,
    dir(path) { plan.dir = path; show('custom'); },
    progress(fraction) {
      if (!$('fill')) return;
      const pct = Math.min(100, Math.max(0, Math.floor(fraction * 100)));
      $('fill').style.width = `${pct}%`;
      $('pct').textContent = `${pct}%`;
    },
    fail(reason) { lastError = reason; show('error'); },
  };

  if (S.preview) {
    show(S.preview);
    if (S.preview === 'installing' || S.preview === 'uninstalling') window.setup.progress(0.46);
    if (S.preview === 'error') window.setup.fail(S.role === 'uninstall' ? '有文件正在使用' : '磁盘空间不足，需要约 600 MB');
  } else {
    show(S.role === 'uninstall' ? 'confirm' : 'welcome');
  }
  post('ready');
  if (S.auto && !S.preview) start(S.role === 'uninstall' ? 'uninstall' : 'install');
</script>
</body>
</html>
