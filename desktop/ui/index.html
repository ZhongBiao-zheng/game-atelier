<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f6f4; --fg: #1d1d1f; --muted: #6e6e73; --line: #d9d9d6; --button: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1d1f; --fg: #e8e8e6; --muted: #9a9a96; --line: #3a3b3f; --button: #2a2b2e; } }
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 14px/1.5 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; -webkit-user-select: none; user-select: none; }
  main { text-align: center; max-width: 440px; padding: 0 24px; }
  h1 { font-size: 15px; font-weight: 600; margin: 0; }
  p { color: var(--muted); margin: 8px 0 20px; white-space: pre-wrap; -webkit-user-select: text; user-select: text; }
  .actions { display: flex; gap: 8px; justify-content: center; }
  button { background: var(--button); color: inherit; border: 1px solid var(--line); border-radius: 6px; padding: 6px 14px; font: inherit; cursor: pointer; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1 id="title">正在启动</h1>
  <p id="detail"></p>
  <div id="actions" class="actions" hidden>
    <button id="retry" type="button">重新启动</button>
    <button id="log" type="button">打开日志</button>
  </div>
</main>
<script>
  const params = new URLSearchParams(location.search);
  if (params.get('name')) document.title = params.get('name');
  const error = params.get('error');
  if (error) {
    document.getElementById('title').textContent = '服务没有运行';
    document.getElementById('detail').textContent = error;
    document.getElementById('actions').hidden = false;
  } else if (params.get('stage') === 'preparing') {
    document.getElementById('title').textContent = '正在准备运行环境';
    document.getElementById('detail').textContent = '首次打开需要几十秒';
  }
  const invoke = (command) => window.__TAURI_INTERNALS__.invoke(command);
  document.getElementById('retry').onclick = () => invoke('retry');
  document.getElementById('log').onclick = () => invoke('open_log');
</script>
</body>
</html>
