<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<style>
  /* Same colours as web/src/styles/tokens.css (--background / --foreground / --muted-foreground). */
  :root { --bg: #0A0A0B; --fg: #EDEDEF; --muted: #8E8E93; --track: rgba(255, 255, 255, 0.08); --line: rgba(255, 255, 255, 0.14); --button: #18181B; }
  :root.light { --bg: #F2F2F3; --fg: #0A0A0B; --muted: #6E6E73; --track: rgba(0, 0, 0, 0.08); --line: rgba(0, 0, 0, 0.1); --button: #FFFFFF; }
  html, body { height: 100%; }
  body { margin: 0; display: grid; place-items: center; background: var(--bg); color: var(--fg); overscroll-behavior: none;
         font: 14px/1.5 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; -webkit-user-select: none; user-select: none; cursor: default; }
  main { display: flex; flex-direction: column; align-items: center; gap: 28px; width: 320px; text-align: center; }
  .mark { width: 72px; height: 72px; fill: var(--fg); }
  .bar { position: relative; width: 160px; height: 3px; overflow: hidden; border-radius: 3px; background: var(--track); }
  .bar > span { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 3px; background: var(--fg); transition: width 120ms linear; }
  .bar.busy > span { width: 30%; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { from { left: -30%; } to { left: 100%; } }
  @media (prefers-reduced-motion: reduce) { .bar.busy > span { animation: none; left: 35%; } }
  .hint { min-height: 21px; margin: -16px 0 0; color: var(--muted); }
  h1 { margin: 0; font-size: 16px; font-weight: 500; }
  p { margin: -16px 0 0; color: var(--muted); white-space: pre-wrap; -webkit-user-select: text; user-select: text; }
  .actions { display: flex; gap: 8px; }
  button { background: var(--button); color: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 6px 14px; font: inherit; cursor: default; }
  [hidden] { display: none !important; }
  /* Electron: the whole page drags the window (title bar hidden), the buttons stay clickable. */
  body { app-region: drag; }
  button, p { app-region: no-drag; }
</style>

    <div class="bar busy" id="bar"><span id="fill"></span></div>
  </div>
  <div class="hint" id="hint"></div>
  <h1 id="title" hidden></h1>
  <p id="detail" hidden></p>
  <div id="actions" class="actions" hidden>
    <button id="retry" type="button"></button>
    <button id="log" type="button">查看日志</button>
  </div>
</main>
<script>
  const params = new URLSearchParams(location.search);
  const name = params.get('name') || '';
  const stage = params.get('stage');
  document.title = name;
  if (params.get('theme') === 'light') document.documentElement.classList.add('light');
  // Electron preload (desktop/src/preload.cjs). The Tauri branch goes with the Tauri shell (batch 4).
  const shellApi = window.atelierLoading ?? {
    retry: () => window.__TAURI_INTERNALS__.invoke('retry'),
    openLog: () => window.__TAURI_INTERNALS__.invoke('open_log'),
  };
  const $ = (id) => document.getElementById(id);

  const errors = {
    start: { title: `${name} 没能打开`, retry: '重试' },
    stopped: { title: `${name} 意外停止了`, retry: '重新打开' },
    install: { title: '安装文件不完整', detail: '请重新下载安装' },
  };
  const error = errors[params.get('error')];
  if (error) {
    $('progress').hidden = true;
    $('hint').hidden = true;
    $('title').hidden = false;
    $('title').textContent = error.title;
    const detail = params.get('detail') || error.detail || '';
    $('detail').hidden = !detail;
    $('detail').textContent = detail;
    if (error.retry) {
      $('actions').hidden = false;
      $('retry').textContent = error.retry;
      $('retry').onclick = () => shellApi.retry();
      $('log').onclick = () => shellApi.openLog();
    }
  } else {
    // The shell pushes unpacking progress (it never answers a request: a reply arriving after the
    // window navigated away would abort the web view). Afterwards the bar only says "still working".
    window.atelierProgress = (done, total) => {
      const unpacking = total > 0 && done < total;
      $('bar').classList.toggle('busy', !unpacking);
      $('fill').style.width = unpacking ? `${Math.round((done / total) * 100)}%` : '';
    };
    // Only a first start (just unpacked) is expected to be slow enough to need a word.
    if (stage === 'preparing' || stage === 'first') {
      setTimeout(() => { $('hint').textContent = '首次打开需要多等一会儿'; }, 8000);
    }
  }
</script>
