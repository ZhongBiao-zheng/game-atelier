[project]
name = "game-atelier"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "watchdog>=5.0",
  "pydantic>=2.9",
  "python-multipart>=0.0.9",
  "requests>=2.32",
  "pypinyin>=0.53",
  "platformdirs>=4",
  'pywin32>=308; sys_platform == "win32"',
  "oss2>=2.19.1",
  "pillow>=12.3,<13",
  "mcp>=2.1.1,<3",
  "onnxruntime>=1.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/character_workflow",
  "src/character_promo",
  "src/character_turnaround",
  "src/viewer_server",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
