name: Desktop

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'scripts/build_desktop.py'
      - 'scripts/smoke_desktop.py'
      - 'scripts/build_release.py'
      - 'scripts/bootstrap.py'
      - 'src/viewer_server/shell_control.py'
      - '.github/workflows/desktop-ci.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'scripts/build_desktop.py'
      - 'scripts/smoke_desktop.py'
      - 'scripts/build_release.py'
      - 'scripts/bootstrap.py'
      - 'src/viewer_server/shell_control.py'
      - '.github/workflows/desktop-ci.yml'
  workflow_dispatch:

# 不设 continue-on-error：失败就是红的。发版不依赖本 workflow，release.yml 的 desktop job 会自己构建并冒烟。
jobs:
  shell:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos-arm64
          - runner: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - name: Install Tauri CLI and generate icons
        working-directory: desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm icons
      - name: Lint and unit-test the shell
        working-directory: desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --release -- -D warnings
          cargo test --release
      - name: Build the runtime bundle used as the seed
        run: uv run --no-project python scripts/build_release.py --output release-build --platform ${{ matrix.platform }}
      - name: Build installer
        run: |
          seed="$(find release-build -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) | head -1)"
          uv run --no-project python scripts/build_desktop.py --seed "$seed" --output desktop-build --platform ${{ matrix.platform }}
      - name: Install, open, quit and uninstall the installed app
        run: |
          installer="$(find desktop-build -maxdepth 1 -type f \( -name '*.dmg' -o -name '*-setup.exe' \) | head -1)"
          uv run --no-project python scripts/smoke_desktop.py --installer "$installer"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-installer-${{ matrix.platform }}
          path: desktop-build/*
          if-no-files-found: ignore
          retention-days: 14
