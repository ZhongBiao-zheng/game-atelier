name: Desktop

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'scripts/build_desktop.py'
      - 'scripts/smoke_desktop.py'
      - 'scripts/desktop_icon_check.ps1'
      - 'scripts/desktop_installer_screens.ps1'
      - 'scripts/build_release.py'
      - 'scripts/bootstrap.py'
      - 'src/viewer_server/shell_control.py'
      - '.github/workflows/desktop-ci.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'scripts/build_desktop.py'
      - 'scripts/smoke_desktop.py'
      - 'scripts/desktop_icon_check.ps1'
      - 'scripts/desktop_installer_screens.ps1'
      - 'scripts/build_release.py'
      - 'scripts/bootstrap.py'
      - 'src/viewer_server/shell_control.py'
      - '.github/workflows/desktop-ci.yml'
  workflow_dispatch:

# 不设 continue-on-error：失败就是红的。发版不依赖本 workflow，release.yml 的 desktop job 会自己构建并冒烟。
jobs:
  shell:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos-arm64
          - runner: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - name: Install the shell's dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile
      - name: Unit-test the shell
        working-directory: desktop
        run: pnpm test
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.platform == 'windows-x64'
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        if: matrix.platform == 'windows-x64'
        with:
          workspaces: desktop/setup
      - name: Lint and unit-test the Windows installer
        if: matrix.platform == 'windows-x64'
        working-directory: desktop/setup
        run: |
          cargo fmt --check
          cargo clippy --release -- -D warnings
          cargo test --release
      # The runtime this build goes with: the installer records its sha256 and BUILD_ID, the app
      # downloads it on first start (here from a local stand-in, the smoke's feed).
      - name: Build the runtime bundle the app downloads
        run: |
          uv run --no-project python scripts/build_release.py --output release-build --platform ${{ matrix.platform }}
          echo "RUNTIME=$(find release-build -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) | head -1)" >> "$GITHUB_ENV"
      - name: Build installer
        run: uv run --no-project python scripts/build_desktop.py --runtime "$RUNTIME" --output desktop-build --platform ${{ matrix.platform }}
      - name: Install, open and quit the app; runtime download, resume and replacement
        run: |
          installer="$(find desktop-build -maxdepth 1 -type f \( -name '*.dmg' -o -name '*-windows-x64.zip' \) | head -1)"
          uv run --no-project python scripts/smoke_desktop.py --installer "$installer" --runtime "$RUNTIME"
      - name: Fresh install, first start, install over the running app, uninstall
        if: matrix.platform == 'windows-x64'
        run: |
          setup="$(find desktop-build -maxdepth 1 -type f -name '*-setup.exe' | head -1)"
          uv run --no-project python scripts/smoke_desktop.py --setup "$setup" --runtime "$RUNTIME"
      - name: Every installer screen (dark / light), a windowed install and a windowed uninstall
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          $setup = Get-ChildItem desktop-build -Filter '*-setup.exe' | Select-Object -First 1
          ./scripts/desktop_installer_screens.ps1 -Installer $setup.FullName -Output desktop-build/installer-shots
      - name: Installer, app and uninstaller icons, and the Apps entry
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          $setup = Get-ChildItem desktop-build -Filter '*-setup.exe' | Select-Object -First 1
          ./scripts/desktop_icon_check.ps1 -Installer $setup.FullName -Output desktop-build/installer-shots
      - name: Title bar screenshots (dark / light)
        if: matrix.platform == 'windows-x64'
        run: node desktop/scripts/window-shots.mjs desktop/dist/win-unpacked desktop-build/window-shots "$RUNTIME"
      # 给人下载的产物只放安装文件；Windows 应用文件夹的 zip 只供上面的冒烟步骤用，不上传。
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-installer-${{ matrix.platform }}
          path: |
            desktop-build/*.dmg
            desktop-build/*.dmg.sha256
            desktop-build/*-setup.exe
            desktop-build/*-setup.exe.sha256
          if-no-files-found: ignore
          retention-days: 14
      # An unreleased build's runtime is not on any release: trying the installer means importing
      # this archive on the first-start page (「从文件导入」).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-runtime-${{ matrix.platform }}
          path: |
            release-build/*.zip
            release-build/*.tar.gz
            release-build/*.sha256
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always() && matrix.platform == 'windows-x64'
        with:
          name: desktop-screenshots-${{ matrix.platform }}
          path: |
            desktop-build/installer-shots/**
            desktop-build/window-shots/**
          if-no-files-found: ignore
          retention-days: 14
