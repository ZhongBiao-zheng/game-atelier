name: Release bundles

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  # 发版不重跑测试：要求本提交已在 main 上跑过 CI 和 CI (Windows)，且每个 job 都成功。
  # Windows job 日常带 continue-on-error，run 结论恒为 success，所以逐个检查 job 结论。
  # make release 推完 main 立刻推 tag，CI 可能还没结束，这里等它跑完。
  ci-passed:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
    steps:
      - name: Require successful CI on main for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for workflow in ci.yml ci-windows.yml; do
            missing=0
            while :; do
              run=$(gh api "repos/$REPO/actions/workflows/$workflow/runs?head_sha=$SHA&branch=main&event=push&per_page=1" \
                --jq '.workflow_runs[0] // empty | "\(.id) \(.status)"')
              if [ -z "$run" ]; then
                # 刚推送的提交，Actions 建 run 有延迟；2 分钟后仍没有就是没测过（例如纯文档提交）。
                missing=$((missing + 1))
                if [ "$missing" -gt 8 ]; then
                  echo "::error::$SHA 在 main 上没有 $workflow 运行，拒绝发版。"
                  exit 1
                fi
                sleep 15
                continue
              fi
              read -r id status <<<"$run"
              [ "$status" = completed ] && break
              echo "$workflow run $id: $status，等待结束"
              sleep 30
            done
            jobs=$(gh api "repos/$REPO/actions/runs/$id/jobs" --jq '.jobs | length')
            failed=$(gh api "repos/$REPO/actions/runs/$id/jobs" \
              --jq '[.jobs[] | select(.conclusion != "success") | "\(.name)=\(.conclusion)"] | join(", ")')
            if [ "$jobs" -eq 0 ] || [ -n "$failed" ]; then
              echo "::error::$workflow run $id 未全部通过（${failed:-无 job}），拒绝发版。重跑失败的 CI 后再重跑本次 Release。"
              exit 1
            fi
            echo "$workflow run $id: $jobs 个 job 全部成功"
          done
  build:
    needs: ci-passed
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows-x64
          - runner: macos-15
            platform: macos-arm64
          - runner: ubuntu-22.04
            platform: linux-x64
    runs-on: ${{ matrix.runner }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build from locked dependencies and committed UI
        run: uv run --no-project python scripts/build_release.py --output release-build --platform ${{ matrix.platform }}
      - name: Smoke relocated archive without system tools
        shell: bash
        run: |
          export ATELIER_BUNDLE_ARCHIVE="$(find release-build -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) | head -1)"
          uv run pytest -v -s tests/test_release_bundle.py
      - uses: actions/upload-artifact@v4
        with:
          name: GameAtelier-${{ matrix.platform }}
          path: |
            release-build/*.zip
            release-build/*.tar.gz
            release-build/*.sha256
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true
      - name: Publish approved tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c 'import json, os; assert os.environ["RELEASE_TAG"] == "v" + json.load(open(".claude-plugin/plugin.json"))["version"]'
          gh release create "$RELEASE_TAG" bundles/* --verify-tag --title "Game Atelier $RELEASE_TAG" --notes-file docs/release-notes.md
  mirror:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: publish
    uses: ./.github/workflows/sync-cnb.yml
    with:
      release_tag: ${{ github.ref_name }}
    secrets: inherit
