name: Release bundles

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  # 发版不重跑测试：要求本提交已在 main 上跑过 CI 和 CI (Windows)，且每个 job 都成功。
  # Windows job 日常带 continue-on-error，run 结论恒为 success，所以逐个检查 job 结论。
  # make release 推完 main 立刻推 tag，CI 可能还没结束，这里等它跑完。
  ci-passed:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
    steps:
      - name: Require successful CI on main for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for workflow in ci.yml ci-windows.yml; do
            missing=0
            while :; do
              run=$(gh api "repos/$REPO/actions/workflows/$workflow/runs?head_sha=$SHA&branch=main&event=push&per_page=1" \
                --jq '.workflow_runs[0] // empty | "\(.id) \(.status)"')
              if [ -z "$run" ]; then
                # 刚推送的提交，Actions 建 run 有延迟；2 分钟后仍没有就是没测过（例如纯文档提交）。
                missing=$((missing + 1))
                if [ "$missing" -gt 8 ]; then
                  echo "::error::$SHA 在 main 上没有 $workflow 运行，拒绝发版。"
                  exit 1
                fi
                sleep 15
                continue
              fi
              read -r id status <<<"$run"
              [ "$status" = completed ] && break
              echo "$workflow run $id: $status，等待结束"
              sleep 30
            done
            jobs=$(gh api "repos/$REPO/actions/runs/$id/jobs" --jq '.jobs | length')
            failed=$(gh api "repos/$REPO/actions/runs/$id/jobs" \
              --jq '[.jobs[] | select(.conclusion != "success") | "\(.name)=\(.conclusion)"] | join(", ")')
            if [ "$jobs" -eq 0 ] || [ -n "$failed" ]; then
              echo "::error::$workflow run $id 未全部通过（${failed:-无 job}），拒绝发版。重跑失败的 CI 后再重跑本次 Release。"
              exit 1
            fi
            echo "$workflow run $id: $jobs 个 job 全部成功"
          done
  build:
    needs: ci-passed
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows-x64
          - runner: macos-15
            platform: macos-arm64
          - runner: ubuntu-22.04
            platform: linux-x64
    runs-on: ${{ matrix.runner }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build from locked dependencies and committed UI
        run: uv run --no-project python scripts/build_release.py --output release-build --platform ${{ matrix.platform }}
      - name: Smoke relocated archive without system tools
        shell: bash
        run: |
          export ATELIER_BUNDLE_ARCHIVE="$(find release-build -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) | head -1)"
          uv run pytest -v -s tests/test_release_bundle.py
      - uses: actions/upload-artifact@v4
        with:
          name: GameAtelier-${{ matrix.platform }}
          path: |
            release-build/*.zip
            release-build/*.tar.gz
            release-build/*.sha256
          if-no-files-found: error
  # 桌面安装器不带运行包：记下对应平台压缩包的 sha256 与 BUILD_ID，首启从 Release 下载同一份字节
  # （与 publish 取同一个构建产物）。它失败不挡压缩包发布与 CNB 同步，但 job 失败照样让整个 run
  # 变红，不用 continue-on-error 盖住。
  desktop:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos-arm64
          - runner: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GameAtelier-${{ matrix.platform }}
          path: runtime
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - name: Install the shell's dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.platform == 'windows-x64'
      - uses: Swatinem/rust-cache@v2
        if: matrix.platform == 'windows-x64'
        with:
          workspaces: desktop/setup
      - name: Build installer for the runtime bundle
        shell: bash
        run: |
          echo "RUNTIME=$(find runtime -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) | head -1)" >> "$GITHUB_ENV"
          runtime="$(find runtime -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) | head -1)"
          uv run --no-project python scripts/build_desktop.py --runtime "$runtime" --output desktop-build --platform ${{ matrix.platform }}
      # Before the release exists the app downloads from the smoke's local feed (same bytes).
      - name: Install, open, quit and uninstall the installed app
        shell: bash
        run: |
          installer="$(find desktop-build -maxdepth 1 -type f \( -name '*.dmg' -o -name '*-windows-x64.zip' \) | head -1)"
          uv run --no-project python scripts/smoke_desktop.py --installer "$installer" --runtime "$RUNTIME"
      - name: Fresh install, first start, install over the running app, uninstall
        if: matrix.platform == 'windows-x64'
        shell: bash
        run: |
          setup="$(find desktop-build -maxdepth 1 -type f -name '*-setup.exe' | head -1)"
          uv run --no-project python scripts/smoke_desktop.py --setup "$setup" --runtime "$RUNTIME"
      # Users get the dmg and the setup.exe; the zipped Windows app folder only feeds the smoke test.
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-installer-${{ matrix.platform }}
          path: |
            desktop-build/*.dmg
            desktop-build/*.dmg.sha256
            desktop-build/*-setup.exe
            desktop-build/*-setup.exe.sha256
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true
      - name: Publish approved tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c 'import json, os; assert os.environ["RELEASE_TAG"] == "v" + json.load(open(".claude-plugin/plugin.json"))["version"]'
          gh release create "$RELEASE_TAG" bundles/* --verify-tag --title "Game Atelier $RELEASE_TAG" --notes-file docs/release-notes.md
  publish-desktop:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [publish, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-installer-*
          path: installers
          merge-multiple: true
      - name: Attach installers to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload "$RELEASE_TAG" installers/* --repo "$GITHUB_REPOSITORY"
  mirror:
    # 等安装器上传结束（成功或失败）再同步，CNB 拿到的附件与 GitHub 一致；压缩包发布失败才不同步。
    if: always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.publish.result == 'success'
    needs: [publish, publish-desktop]
    uses: ./.github/workflows/sync-cnb.yml
    with:
      release_tag: ${{ github.ref_name }}
    secrets: inherit
  # 桌面安装包首启从 CNB / GitHub 下载同版本运行包：镜像结束后逐个来源、逐个平台请求运行包与 .sha256
  # 的第一个字节，缺任何一个就失败，提醒补同步（不下载整个文件）。
  release-assets:
    if: always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.publish.result == 'success'
    needs: [publish, mirror]
    runs-on: ubuntu-latest
    steps:
      - name: Every source serves every runtime archive and its checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          missing=0
          for base in https://cnb.cool/ZhongBiao-zheng/game-atelier/-/releases https://github.com/ZhongBiao-zheng/game-atelier/releases; do
            for asset in "GameAtelier-$version-windows-x64.zip" "GameAtelier-$version-macos-arm64.tar.gz" "GameAtelier-$version-linux-x64.tar.gz"; do
              for file in "$asset" "$asset.sha256"; do
                url="$base/download/$RELEASE_TAG/$file"
                if curl -fsSL --retry 3 -r 0-0 -o /dev/null "$url"; then echo "ok      $url"; else echo "MISSING $url"; missing=1; fi
              done
            done
          done
          exit $missing
