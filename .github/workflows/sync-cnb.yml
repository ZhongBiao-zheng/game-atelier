name: Sync CNB mirror

# main 的国内镜像 cnb.cool/ZhongBiao-zheng/game-atelier：一键启动和版本检查先读它。
# 镜像只跟随 GitHub，不在 CNB 上直接提交，所以强推覆盖。
on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true
    secrets:
      CNB_TOKEN:
        required: true

concurrency:
  group: sync-cnb
  cancel-in-progress: false

jobs:
  push:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push main to CNB
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          git push --force "https://cnb:${CNB_TOKEN}@cnb.cool/ZhongBiao-zheng/game-atelier.git" HEAD:refs/heads/main

  release:
    if: github.event_name == 'release' || inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download published assets and mirror the approved tag
        env:
          GH_TOKEN: ${{ github.token }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          gh release download "$RELEASE_TAG" --dir bundles
          git push "https://cnb:${CNB_TOKEN}@cnb.cool/ZhongBiao-zheng/game-atelier.git" "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          from urllib.parse import quote
          from pathlib import Path
          base = 'https://api.cnb.cool/ZhongBiao-zheng/game-atelier/-/releases'
          headers = {'Authorization': 'Bearer ' + os.environ['CNB_TOKEN'], 'Content-Type': 'application/json'}
          tag = os.environ['RELEASE_TAG']
          try:
              urllib.request.urlopen(urllib.request.Request(base + '/tags/' + quote(tag, safe=''), headers=headers), timeout=30).close()
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise RuntimeError(f'CNB release lookup failed: HTTP {error.code}') from None
              body = json.dumps({'tag_name': tag, 'name': 'Game Atelier ' + tag,
                                 'body': Path('docs/release-notes.md').read_text(), 'make_latest': 'true'}).encode()
              urllib.request.urlopen(urllib.request.Request(base, data=body, headers=headers), timeout=30).close()
          PY
      - name: Upload using CNB official attachments plugin
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          PLUGIN_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
          CNB_API_ENDPOINT: https://api.cnb.cool
          CNB_WEB_ENDPOINT: https://cnb.cool
          CNB_REPO_SLUG: ZhongBiao-zheng/game-atelier
          CNB_IS_TAG: 'true'
          PLUGIN_ATTACHMENTS: './bundles/*'
        run: |
          docker run --rm -e CNB_TOKEN -e CNB_API_ENDPOINT -e CNB_WEB_ENDPOINT -e CNB_REPO_SLUG -e CNB_IS_TAG -e PLUGIN_TAG -e PLUGIN_ATTACHMENTS -v "$PWD:$PWD" -w "$PWD" cnbcool/attachments:latest
