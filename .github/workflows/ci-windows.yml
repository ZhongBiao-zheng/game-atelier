name: CI (Windows)

on:
  push:
    branches: [main]
    # 与 ci.yml 相同：纯文档提交不跑；测试会读的文档重新纳入。
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - 'README.md'
      - 'skills/**'
      - 'docs/references/**'
      - 'docs/team-library-format.md'
  pull_request:
  workflow_dispatch:

# 日常非阻塞：job 失败时 run 结论仍为 success。Release 逐个检查 job 结论，失败照样拒绝发版。
jobs:
  pytest-windows:
    runs-on: windows-latest
    continue-on-error: true
    env:
      # Windows 默认 stdio/文件编码非 UTF-8（cp1252/cp936），撞仓库里大量中文内容会
      # UnicodeDecode/EncodeError。UTF-8 模式让 open()/read_text()/subprocess text 一律 UTF-8，
      # 与 mac/Linux（默认即 UTF-8）对齐。产品源码已逐处显式 encoding="utf-8"，此处是测试环境归一。
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install Python deps
        shell: bash
        # 依赖源是清华镜像（pyproject.toml 的 tool.uv.index），GitHub 的机器连它偶发下载失败：
        # 失败后等一会儿再装，最多 4 次；已下载的包留在 uv 缓存里，重试只补缺的。
        run: |
          for attempt in 1 2 3 4; do
            uv sync && exit 0
            echo "uv sync 第 ${attempt} 次失败，$((attempt * 15)) 秒后重试"
            sleep $((attempt * 15))
          done
          exit 1

      - name: Measure first and daily startup (informational)
        shell: pwsh
        run: |
          $env:GAME_ATELIER_DATA_ROOT = Join-Path $env:RUNNER_TEMP "atelier-startup"
          $env:GAME_ATELIER_NO_UPDATE_CHECK = "1"
          $env:BROWSER = "true"
          try {
            foreach ($label in @("first", "daily")) {
              $timer = [Diagnostics.Stopwatch]::StartNew()
              uv run --no-project python scripts/bootstrap.py --launch
              Write-Host "$label startup: $($timer.Elapsed.TotalSeconds.ToString('F1'))s (exit=$LASTEXITCODE)"
            }
          } finally {
            uv run --no-project python scripts/bootstrap.py --run -m viewer_server.server stop
          }

      - name: Run pytest
        run: uv run pytest -v -n auto

  vitest-windows:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Install web deps
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Run vitest
        working-directory: web
        run: pnpm test
