name: CI (Windows)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-windows:
    runs-on: windows-latest
    continue-on-error: true   # 仍非阻塞；本次修复跑绿后再单独翻成必过门
    env:
      # Windows 默认 stdio/文件编码非 UTF-8（cp1252/cp936），撞仓库里大量中文内容会
      # UnicodeDecode/EncodeError。UTF-8 模式让 open()/read_text()/subprocess text 一律 UTF-8，
      # 与 mac/Linux（默认即 UTF-8）对齐。产品源码已逐处显式 encoding="utf-8"，此处是测试环境归一。
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install Python deps
        run: uv sync

      - name: Run pytest
        run: uv run pytest -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Install web deps
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Run vitest
        working-directory: web
        run: pnpm test
